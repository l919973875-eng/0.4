name: Validate monitoring logic

on:
  pull_request:
    paths:
      - 'cloud_runner.py'
      - 'intelligence_engine.py'
      - 'social_connectors.py'
      - 'requirements*.txt'
      - 'config/**'
      - 'tools/test_*.py'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          python cloud_runner.py --self-test
          python tools/test_social_keyword_pack.py
          python tools/test_signal_engine_v050.py
