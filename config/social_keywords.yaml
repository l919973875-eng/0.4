# v0.4.4 社交搜索 taxonomy / query generator
#
# 搜索层只生成“高价值合法组合”，不做全量 objects × actions × scenes 笛卡尔积。
# xhs 已启用自动生成；dy / wb 仍保留 v0.4.3 静态词包，待小红书验证后复制。
# signal = 每日自动巡检；broad = 手动深搜。query_budget 控制每日总 query 数。
# taxonomy 同时被 cloud_runner.py 的社交质检读取，使“发现词”和“入池动作词”保持一致。

