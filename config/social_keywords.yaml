# 社交平台搜索词分组。
# 设计原则：搜索词负责“发现”，筛选规则负责“是否进入苗头池”。
# 不再默认使用“ 中国 / 华为 / 比亚迪 ”这种单独泛词，因为它们会带来大量生活、消费和产品内容。

default_pack: signal
max_per_query:
  signal: 5
  broad: 8

packs:
  signal:
    xhs:
      - 中国员工 撤离
      - 中国员工 遇袭
      - 中国公民 被捕
      - 中国公民 失踪
      - 中资矿山 抗议
      - 中资矿山 停产
      - 中资工厂 罢工
      - 中资工厂 停产
      - 中资项目 抗议
      - 中资项目 封锁
      - 一带一路 项目 受阻
      - 中国企业 制裁
      - 中国企业 调查
      - 华为 禁令
      - 比亚迪 调查
      - 宁德时代 抗议
      - 中国电动车 关税
      - 台海 军演
      - 南海 海警 冲突
      - 菲律宾 中国 海警
    dy:
      - 中国员工 撤离
      - 中国员工 遇袭
      - 中资矿山 抗议
      - 中资工厂 罢工
