      - 华为 禁令
      - 比亚迪 调查
      - 台海 军演
      - 南海 海警 冲突
    wb:
      - 中国员工 撤离
      - 中国公民 遇袭
      - 中资项目 抗议
      - 中资企业 停产
      - 中国企业 制裁
      - 中国企业 出口管制
      - 华为 禁令
      - 比亚迪 调查
      - 台海 军演
      - 南海 冲突

