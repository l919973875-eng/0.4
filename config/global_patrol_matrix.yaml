version: 1
window_hours: 48
reporting:
  direct: 85
  high_transmission: 65
  observation: 45
  max_output_events: 20
# Public, event-level monitoring only. No private groups, personal profiling, or operational tracking.
global_trigger_terms:
  - sanctions
  - export control
  - blockade
  - armed conflict
  - military exercise
  - cyberattack
  - data breach
  - emergency
  - disruption
  - shutdown
  - recall
  - investigation
  - 制裁
  - 出口管制
  - 封锁
  - 冲突
  - 军演
  - 网络攻击
  - 数据泄露
  - 紧急状态
  - 中断
  - 停运
  - 召回
  - 调查
domains:
  great_power_competition:
    label_zh: 大国博弈
    high_frequency: true
    terms: [战略竞争, 同盟, 印太, 制裁, 关税, strategic competition, alliance, Indo-Pacific, sanctions, tariff]
  political_security:
    label_zh: 政治安全
    high_frequency: true
    terms: [外交危机, 政治危机, 政权更迭, 选举争议, 断交, diplomatic crisis, political crisis, coup, election dispute, sever ties]
  science_technology_security:
